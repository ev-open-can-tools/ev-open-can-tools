name: Fix Pages safety guide link

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/dashboard-onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Replace fragile relative safety links
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/build_pages_onboarding.py')
          content = script.read_text(encoding='utf-8')
          old = 'href="../docs/nag-killer.html"'
          new = 'href="https://ev-open-can-tools.github.io/ev-open-can-tools/docs/nag-killer.html"'
          if old not in content and new not in content:
              raise SystemExit('Expected CAN safety link was not found')
          script.write_text(content.replace(old, new), encoding='utf-8')

          test = Path('test/test_pages_onboarding_preview.py')
          content = test.read_text(encoding='utf-8')
          assertion = '        self.assertIn("https://ev-open-can-tools.github.io/ev-open-can-tools/docs/nag-killer.html", page)\n'
          anchor = '        self.assertIn("Model 3 electrical reference", page)\n'
          if assertion not in content:
              if anchor not in content:
                  raise SystemExit('Expected test insertion point was not found')
              content = content.replace(anchor, anchor + assertion)
              test.write_text(content, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_pages_onboarding.py test/test_pages_onboarding_preview.py
          if git diff --cached --quiet; then
            echo "Safety link already fixed"
            exit 0
          fi
          git commit -m "Fix onboarding CAN safety guide link"
          git push origin HEAD:${{ github.head_ref }}
