name: Apply dashboard onboarding

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/dashboard-onboarding'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Apply onboarding changes
        run: python .github/apply_dashboard_onboarding.py

      - name: Validate generated dashboard
        run: |
          python scripts/minify_dashboard.py
          python -m unittest discover -s test -p 'test_dashboard_onboarding_regression.py' -v

      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/web/mcp2515_dashboard_ui.src.h include/web/mcp2515_dashboard_ui.h docs/onboarding.md CHANGELOG.md test/test_dashboard_onboarding_regression.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add guided dashboard onboarding"
          git push origin HEAD:${{ github.head_ref }}
