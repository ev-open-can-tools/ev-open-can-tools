name: Apply dashboard onboarding

on:
  push:
    branches:
      - feature/dashboard-onboarding
    paths:
      - .github/apply_dashboard_onboarding.py
      - .github/workflows/apply-dashboard-onboarding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/dashboard-onboarding
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Apply onboarding changes
        run: python .github/apply_dashboard_onboarding.py

      - name: Validate generated dashboard
        run: |
          python scripts/minify_dashboard.py
          python -m unittest test.test_dashboard_onboarding_regression

      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/web/mcp2515_dashboard_ui.src.h include/web/mcp2515_dashboard_ui.h docs/onboarding.md CHANGELOG.md test/test_dashboard_onboarding_regression.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add guided dashboard onboarding"
          git push
