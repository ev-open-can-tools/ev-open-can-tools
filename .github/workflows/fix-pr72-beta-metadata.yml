name: Fix PR 72 beta metadata

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-beta-metadata:
    if: github.event.pull_request.number == 72
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update beta version metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "3.0.2-beta.1"
          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = f"## [{version}] - 2026-06-12"

          if heading not in text:
              marker = "## [Unreleased]\n"
              section = (
                  f"\n{heading}\n\n"
                  "### Fixed\n\n"
                  "- Legacy FSD activation injection on CAN `0x3EE` mux 0 now waits until Autopilot has remained active for 2 seconds when the AP Injection Gate is enabled, preventing false parked gate states and activation timing races from injecting during initial engagement.\n"
              )
              if marker not in text:
                  raise SystemExit("Unreleased heading not found")
              text = text.replace(marker, marker + section, 1)
              changelog.write_text(text, encoding="utf-8")

          Path("VERSION").write_text(version, encoding="utf-8")
          Path(".github/workflows/fix-pr72-beta-metadata.yml").unlink()
          PY

      - name: Commit metadata fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSION .github/workflows/fix-pr72-beta-metadata.yml
          git commit -m "Fix beta release metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
