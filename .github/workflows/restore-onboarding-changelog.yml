name: Restore onboarding changelog

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'feature/dashboard-onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore changelog before Pages documentation edit
        run: git checkout 08448fd987bd9cc93bbcf980692cb48ee257ab59 -- CHANGELOG.md
      - name: Commit restored changelog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelog already restored"
            exit 0
          fi
          git commit -m "Restore changelog history"
          git push origin HEAD:${{ github.head_ref }}
